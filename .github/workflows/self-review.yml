name: Self Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: mlk/ollama-review-action@main
        with:
          model: glm-5.3
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
