name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Verify dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is out of date. Run 'npm run build' and commit the result."
            git diff dist
            exit 1
          fi

      - name: Verify the pinned action SHA is consistent
        run: |
          readme_sha=$(grep -oE 'ollama-review-action@[0-9a-f]{40}' README.md | head -1 | cut -d@ -f2)
          workflow_sha=$(grep -oE 'ollama-review-action@[0-9a-f]{40}' .github/workflows/self-review.yml | head -1 | cut -d@ -f2)
          if [ -z "$readme_sha" ] || [ -z "$workflow_sha" ]; then
            echo "Could not find a pinned action SHA in README.md or self-review.yml."
            exit 1
          fi
          if [ "$readme_sha" != "$workflow_sha" ]; then
            echo "Pinned SHAs differ: README.md=$readme_sha self-review.yml=$workflow_sha"
            echo "Update both to the same release SHA."
            exit 1
          fi
          echo "Pinned action SHA: $readme_sha"
